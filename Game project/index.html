<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            margin: 0;
            font-family: sans-serif;
            background-color: black;

        }
    </style>
    <div style="
        position: absolute; 
        color: white; 
        padding: 8px; 
        font-size: 14px;
        user-select: none;">
        <span>
            Score: <span id="scoreElement">0</span>
        </span>
    </div>

    <div  id="modalElement" style="
        display: none;
        position: absolute;
        background-color: white;
        top: 50%;
        transform: translate(-50%,-50%);
        left: 50%;
        padding: 16px;
        max-width: 500px;
        width: 100%;
        text-align: center;
        border-radius: 10px;">

        <label style="font-size: 14px; color: red;">Game Over</label>
        <h1 id="modalScoreElement" style="font-size: 48px;margin-bottom: 0;margin-top: 8px;">0</h1>
        <p style="margin: 0; font-size: 14px; color: grey;">Points</p>
        <button id="button" style="margin-top: 12px;background-color: blue; border: none; color: white; padding: 8px 16px; border-radius: 10px;cursor: pointer;">Restart</button>
    </div>

     <div  id="startModalElement" style="
        position: absolute;
        background-color: white;
        top: 50%;
        transform: translate(-50%,-50%);
        left: 50%;
        padding: 16px;
        max-width: 500px;
        width: 100%;
        text-align: center;
        border-radius: 10px;">

        
        <h1  style="font-size: 24px;margin-bottom: 0;margin-top: 8px;">Circle Destroyer</h1>
        <button id="startButton" style="margin-top: 12px;background-color: blue; border: none; color: white; padding: 8px 16px; border-radius: 10px;cursor: pointer;">Start</button>
    </div>


    <canvas></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" 
    integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
     crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="./index.js"></script>
</body>
</html>
